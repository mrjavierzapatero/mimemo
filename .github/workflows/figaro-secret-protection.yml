name: Figaro secret protection
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: figaro-secrets-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install checksum-pinned scanner
        run: node .figaro-security/install-scanner.mjs
      - name: Test security guard with disposable fixtures and real scanner
        run: node .figaro-security/run-tests.mjs
      - name: Scan history and browser source boundaries
        run: node .figaro-security/guard.mjs ci
      - name: Build browser without application secrets
        run: node .figaro-security/build-browser.mjs
      - name: Scan browser artifacts
        run: node .figaro-security/guard.mjs browser
